name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test binaries are built once and thrown away, and nothing here reads a
  # backtrace: skipping debuginfo saves linking dozens of test binaries with
  # their PDBs and keeps the build cache small. Panic messages still carry
  # their file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

# A stacked branch is often pushed several times in a row, and only its newest
# revision needs checking. A push to main is not the same: it gets a group of
# its own so a merge landing while the previous one still builds cannot cancel
# it. A cancelled job never reaches its cache-save step, and the Windows lane
# is slow enough that one lost cache makes every later run cold as well.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Split out from the test lane so formatting and lint feedback does not sit
  # behind the test build, and so neither waits for the other.
  lint:
    name: lint (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  rust:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test -p eidos-service export_api_contract --lib
      - run: git diff --exit-code -- web/src/generated/api.ts
      - run: cargo test

  rust-macos:
    name: rust (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo clippy --all-targets -- -D warnings
      # The macOS adapters (getattrlistbulk enumeration, the FSEvents feed)
      # only exist on this lane, and the shared filesystem and change
      # contracts must hold on both platforms rather than on Windows alone.
      - run: cargo test

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
