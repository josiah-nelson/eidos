name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test binaries are built once and thrown away, and nothing here reads a
  # backtrace: skipping debuginfo saves linking dozens of test binaries with
  # their PDBs and keeps the build cache small. Panic messages still carry
  # their file and line.
  CARGO_PROFILE_DEV_DEBUG: 0

# A stacked branch is often pushed several times in a row, and only its newest
# revision needs checking. A push to main is not the same: it gets a group of
# its own so a merge landing while the previous one still builds cannot cancel
# it. A cancelled job never reaches its cache-save step.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Windows keeps the lint lane and not the test lane. `--all-targets` type
  # checks and lints every cfg(windows) file, tests included, so Windows
  # compile breakage still fails here in about a minute. What it cannot catch
  # is Windows runtime behaviour, and that is covered three other ways:
  # scripts/check.ps1 runs the whole suite on Windows before a commit,
  # nightly.yml runs it again every night, and release.yml gates the tag on
  # it. Paying three minutes of Windows build per commit to run fourteen
  # seconds of Windows-specific tests was not worth it at this commit rate.
  lint:
    name: lint (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Shared with nightly.yml and release.yml's gate job: all three
          # build the same dev-profile Windows artifacts.
          shared-key: windows-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The functional gate. It runs the same 37 test binaries the Windows lane
  # used to, in well under half the time, and it owns the generated API
  # contract check because that is generated from Rust types and is the same
  # on every platform.
  rust-macos:
    name: rust (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest
      - run: cargo clippy --all-targets -- -D warnings
      # The macOS adapters (getattrlistbulk enumeration, the FSEvents feed)
      # only exist on this lane, and the shared filesystem and change
      # contracts must hold on both platforms rather than on Windows alone.
      - run: cargo nextest run
      # nextest does not run doctests; this compiles them and runs the few
      # that exist without rebuilding anything else.
      - run: cargo test --doc
      # export_api_contract is an eidos-service lib test, so the suite above
      # has already regenerated the contract; checking it here rather than
      # in a step of its own avoids a second build of eidos-service and its
      # dependencies, which cost more than two minutes on this runner. The
      # cost is learning about contract drift after the suite instead of
      # before it, and scripts/check.ps1 already catches it before a commit.
      - run: git diff --exit-code -- web/src/generated/api.ts

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
