name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: rust (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p eidos-service export_api_contract --lib
      - run: git diff --exit-code -- web/src/generated/api.ts
      - run: cargo test

  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build executable with the embedded UI (debug)
        env:
          EIDOS_REQUIRE_WEB: "1"
        run: cargo build --locked --bin eidos
      - name: Build MSI, setup UI and bundle
        shell: pwsh
        run: .\installer\build.ps1 -SkipWeb -SkipRust -BinDir target\debug
      - name: Silent per-user install, health check, uninstall
        shell: pwsh
        run: |
          $setup = "installer\out\eidos-setup.exe"
          $log = "$env:RUNNER_TEMP\eidos-ci-install.log"
          $p = Start-Process $setup -ArgumentList "/quiet /log `"$log`" EIDOS_PORT=7710" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log | Select-Object -Last 40; throw "install exit $($p.ExitCode)" }
          $r = Invoke-WebRequest http://127.0.0.1:7710/api/health -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "health $($r.StatusCode)" }
          $u = Start-Process $setup -ArgumentList "/quiet /uninstall EIDOS_REMOVE_DATA=1 /log `"$log.uninstall`"" -Wait -PassThru
          if ($u.ExitCode -ne 0) { Get-Content "$log.uninstall" | Select-Object -Last 40; throw "uninstall exit $($u.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA\eidos") { throw "data directory left behind" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\eidos") { throw "program directory left behind" }
      - uses: actions/upload-artifact@v4
        with:
          name: eidos-setup-unsigned
          path: |
            installer/out/eidos-setup.exe
            installer/out/eidos.msi

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
