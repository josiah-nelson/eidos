name: installer

# The unsigned installer lifecycle test is expensive (web UI, Rust, the .NET
# setup UI, WiX, and real installs on the runner) and is not run on pull
# requests. Release builds are covered by release.yml on a v* tag; run this
# by hand when changing installer authoring, build.ps1, or the collector:
#
#   gh workflow run installer.yml --ref <branch>
#
# Lifecycle paths covered (sprint track A gate): core-only per-user;
# core-plus-collector per-machine through the unified setup; upgrade from
# the separate collector package into the unified setup without rotating
# the study key; repair; uninstall keeping data; explicit purge of exactly
# the requested product's data.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build executable with the embedded UI (debug)
        env:
          EIDOS_REQUIRE_WEB: "1"
        run: cargo build --locked --bin eidos
      - name: Build both MSIs, the setup UI and both bundles
        shell: pwsh
        run: .\installer\build.ps1 -SkipWeb -SkipRust -BinDir target\debug

      - name: Build a newer version of everything for the upgrade paths
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\installer\out\upgrade"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($project in 'Eidos.Msi', 'Eidos.Collector.Msi', 'Eidos.Bundle', 'Eidos.Collector.Bundle') {
            Remove-Item -Recurse -Force "installer\$project\obj", "installer\$project\bin" -ErrorAction SilentlyContinue
          }
          $bin = "$env:GITHUB_WORKSPACE\target\debug"
          $ba = "$env:GITHUB_WORKSPACE\installer\Eidos.Setup.Ui\bin\Release\net472"
          dotnet build installer\Eidos.Msi\Eidos.Msi.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:BinDir=$bin -p:OutDir="$out\"
          dotnet build installer\Eidos.Collector.Msi\Eidos.Collector.Msi.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:BinDir=$bin -p:OutDir="$out\"
          dotnet build installer\Eidos.Bundle\Eidos.Bundle.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:MsiPath="$out\eidos.msi" -p:CollectorMsiPath="$out\eidos-collector.msi" -p:BaDir=$ba -p:OutDir="$out\"
          dotnet build installer\Eidos.Collector.Bundle\Eidos.Collector.Bundle.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:MsiPath="$out\eidos-collector.msi" -p:OutDir="$out\"

      - name: Define helpers
        shell: pwsh
        run: |
          @'
          function Run-Setup([string]$exe, [string]$arguments, [string]$log) {
            # Start-Process -Wait would wait for the process tree, and a
            # per-user install leaves eidos.exe running in the background;
            # wait for the setup process alone.
            $p = [Diagnostics.Process]::Start($exe, "$arguments /log `"$log`"")
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "setup did not finish: $exe $arguments" }
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60; throw "$exe $arguments exited $($p.ExitCode)" }
          }
          function Wait-Health([int]$port) {
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Seconds 2
            }
            throw "no healthy service on port $port"
          }
          function Assert-Service([string]$name, [string]$state) {
            $s = Get-Service $name -ErrorAction SilentlyContinue
            if ($null -eq $s) { throw "service $name is not registered" }
            if ($s.Status -ne $state) { throw "service $name is $($s.Status), expected $state" }
          }
          '@ | Set-Content "$env:RUNNER_TEMP\helpers.ps1"

      - name: Core only, per-user (install, health, uninstall with purge)
        shell: pwsh
        timeout-minutes: 15
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $setup = "installer\out\eidos-setup.exe"
          Run-Setup $setup "/quiet EIDOS_PORT=7710" "$env:RUNNER_TEMP\core-user-install.log"
          Wait-Health 7710
          if (Get-Service eidos-collector -ErrorAction SilentlyContinue) { throw "the collector was installed without being asked for" }
          Run-Setup $setup "/quiet /uninstall EIDOS_REMOVE_DATA=1" "$env:RUNNER_TEMP\core-user-uninstall.log"
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "eidos.exe still running after uninstall" }
          if (Test-Path "$env:LOCALAPPDATA\eidos") { throw "data directory left behind" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\eidos") { throw "program directory left behind" }

      - name: Separate collector package first (the pre-unified fleet path)
        shell: pwsh
        timeout-minutes: 15
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $key = '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
          Run-Setup "installer\out\eidos-collector-setup.exe" "/quiet EIDOS_STUDY_KEY=$key EIDOS_LANES=usn,content EIDOS_UPLOAD=$env:RUNNER_TEMP\drop EIDOS_UPLOAD_HOUR=0" "$env:RUNNER_TEMP\collector-standalone.log"
          Assert-Service eidos-collector Running
          $status = & 'C:\Program Files\eidos-collector\eidos.exe' observe status | ConvertFrom-Json
          if (-not $status.capabilities.windows.study_key_available) { throw "the study key was not imported" }
          $config = Get-Content 'C:\ProgramData\eidos-collector\config.json' -Raw | ConvertFrom-Json
          if (-not $config.lanes.content.enabled) { throw "EIDOS_LANES did not reach config.json" }
          if ($config.upload.hour -ne 0) { throw "EIDOS_UPLOAD_HOUR=0 did not reach config.json" }
          # A runtime choice the unified upgrade must not overwrite.
          & 'C:\Program Files\eidos-collector\eidos.exe' observe lanes --enumeration on
          (Get-FileHash 'C:\ProgramData\eidos-collector\study.key').Hash | Set-Content "$env:RUNNER_TEMP\study-key.hash"

      - name: Unified setup upgrades the separate collector into core-plus-collector
        shell: pwsh
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          # Real work in flight so the upgrade has to stop a busy collector.
          1..200 | ForEach-Object { Set-Content "$env:RUNNER_TEMP\churn-$_.txt" "change $_" }
          Start-Sleep -Seconds 5
          $setup = "installer\out\upgrade\eidos-setup.exe"
          Run-Setup $setup "/quiet EIDOS_SCOPE=perMachine EIDOS_PORT=7720 EIDOS_INSTALL_COLLECTOR=1" "$env:RUNNER_TEMP\unified-install.log"
          Wait-Health 7720
          Assert-Service eidos Running
          Assert-Service eidos-collector Running
          if ((Get-ItemProperty 'HKLM:\Software\eidos-collector').Version -ne '99.0.0') { throw "the collector package was not upgraded" }
          if ((Get-ItemProperty 'HKLM:\Software\eidos').Version -ne '99.0.0') { throw "the core package was not installed" }
          if ((Get-FileHash 'C:\ProgramData\eidos-collector\study.key').Hash -ne (Get-Content "$env:RUNNER_TEMP\study-key.hash")) { throw "the upgrade rotated the study key" }
          $after = Get-Content 'C:\ProgramData\eidos-collector\config.json' -Raw | ConvertFrom-Json
          if (-not $after.lanes.enumeration.enabled) { throw "the upgrade overwrote a runtime lane change" }
          if ($after.upload.hour -ne 0) { throw "the upgrade changed the upload hour" }
          # The old collector bundle registration is gone; one product remains.
          $arp = Get-ChildItem 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall' | Get-ItemProperty | Where-Object { $_.DisplayName -like 'eidos observatory collector*' }
          if ($arp) { throw "the separate collector bundle is still registered: $($arp.DisplayName)" }
          # The core's fleet identity exists and the loopback API answers.
          $fleet = Invoke-WebRequest http://127.0.0.1:7720/api/fleet -UseBasicParsing -TimeoutSec 30 | ConvertFrom-Json
          if (-not $fleet.node_id) { throw "no fleet identity" }
          if ($fleet.central) { throw "a fresh install must not be a central" }
          $fleet.node_id | Set-Content "$env:RUNNER_TEMP\node-id"
          if (-not (Test-Path 'C:\ProgramData\eidos\fleet\node.key')) { throw "fleet key not created" }

      - name: Repair keeps both services, the identities and the cursors
        shell: pwsh
        timeout-minutes: 15
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          Run-Setup "installer\out\upgrade\eidos-setup.exe" "/quiet /repair" "$env:RUNNER_TEMP\unified-repair.log"
          Wait-Health 7720
          Assert-Service eidos Running
          Assert-Service eidos-collector Running
          if ((Get-FileHash 'C:\ProgramData\eidos-collector\study.key').Hash -ne (Get-Content "$env:RUNNER_TEMP\study-key.hash")) { throw "repair rotated the study key" }
          $fleet = Invoke-WebRequest http://127.0.0.1:7720/api/fleet -UseBasicParsing -TimeoutSec 30 | ConvertFrom-Json
          if ($fleet.node_id -ne (Get-Content "$env:RUNNER_TEMP\node-id")) { throw "repair changed the fleet node identity" }

      - name: Uninstall keeps data by default, for both products
        shell: pwsh
        timeout-minutes: 15
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          Run-Setup "installer\out\upgrade\eidos-setup.exe" "/quiet /uninstall" "$env:RUNNER_TEMP\unified-uninstall-keep.log"
          if (Get-Service eidos -ErrorAction SilentlyContinue) { throw "the eidos service is still registered" }
          if (Get-Service eidos-collector -ErrorAction SilentlyContinue) { throw "the collector service is still registered" }
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "eidos.exe still running after uninstall" }
          if (-not (Test-Path 'C:\ProgramData\eidos\catalog.db')) { throw "the core data was deleted without being asked" }
          if (-not (Test-Path 'C:\ProgramData\eidos-collector\study.key')) { throw "the collector's study data was deleted without being asked" }
          if (-not (Test-Path 'C:\ProgramData\eidos\fleet\node.key')) { throw "the fleet identity was deleted without being asked" }

      - name: Reinstall keeps the identities, then purge removes exactly what was asked
        shell: pwsh
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $setup = "installer\out\upgrade\eidos-setup.exe"
          Run-Setup $setup "/quiet EIDOS_SCOPE=perMachine EIDOS_PORT=7720 EIDOS_INSTALL_COLLECTOR=1" "$env:RUNNER_TEMP\unified-reinstall.log"
          Wait-Health 7720
          if ((Get-FileHash 'C:\ProgramData\eidos-collector\study.key').Hash -ne (Get-Content "$env:RUNNER_TEMP\study-key.hash")) { throw "reinstall rotated the study key" }
          $fleet = Invoke-WebRequest http://127.0.0.1:7720/api/fleet -UseBasicParsing -TimeoutSec 30 | ConvertFrom-Json
          if ($fleet.node_id -ne (Get-Content "$env:RUNNER_TEMP\node-id")) { throw "reinstall changed the fleet node identity" }
          # Purge the core's data, keep the collector service and its data.
          Run-Setup $setup "/quiet /uninstall EIDOS_REMOVE_DATA=1 EIDOS_REMOVE_COLLECTOR=0" "$env:RUNNER_TEMP\unified-uninstall-core-purge.log"
          if (Test-Path 'C:\ProgramData\eidos') { throw "core data directory left behind after purge" }
          if (Test-Path 'C:\Program Files\eidos') { throw "core program directory left behind" }
          Assert-Service eidos-collector Running
          if (-not (Test-Path 'C:\ProgramData\eidos-collector\study.key')) { throw "purging the core removed the collector's data" }
          # Now the collector, explicitly, with its data.
          Run-Setup $setup "/quiet /uninstall EIDOS_REMOVE_COLLECTOR=1 EIDOS_COLLECTOR_REMOVE_DATA=1" "$env:RUNNER_TEMP\unified-uninstall-collector-purge.log"
          if (Get-Service eidos-collector -ErrorAction SilentlyContinue) { throw "the collector service is still registered" }
          if (Test-Path 'C:\ProgramData\eidos-collector') { throw "collector data directory left behind after purge" }
          if (Test-Path 'C:\Program Files\eidos-collector') { throw "collector program directory left behind" }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eidos-setup-unsigned
          path: |
            installer/out/eidos-setup.exe
            installer/out/eidos.msi
            installer/out/eidos-collector-setup.exe
            installer/out/eidos-collector.msi
            ${{ runner.temp }}/*.log
