name: installer

# Core install, upgrade, repair, retirement gate and data-preserving uninstall.
# Run once per cohesive installer change; also required before release publication.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x
      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build executable with the embedded UI (debug)
        env:
          EIDOS_REQUIRE_WEB: "1"
        run: cargo build --locked --bin eidos
      - name: Build the core MSI, setup UI and bundle
        shell: pwsh
        run: .\installer\build.ps1 -SkipWeb -SkipRust -BinDir target\debug

      - name: Build a newer version of everything for the upgrade paths
        shell: pwsh
        run: |
          $out = "$env:GITHUB_WORKSPACE\installer\out\upgrade"
          New-Item -ItemType Directory -Force $out | Out-Null
          foreach ($project in 'Eidos.Msi', 'Eidos.Bundle') {
            $projectRoot = [IO.Path]::GetFullPath("$env:GITHUB_WORKSPACE\installer\$project")
            foreach ($folder in 'obj', 'bin') {
              $target = [IO.Path]::GetFullPath((Join-Path $projectRoot $folder))
              if (-not $target.StartsWith($projectRoot + '\', [StringComparison]::OrdinalIgnoreCase)) { throw "invalid clean target: $target" }
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Recurse -Force }
            }
          }
          $bin = "$env:GITHUB_WORKSPACE\target\debug"
          $ba = "$env:GITHUB_WORKSPACE\installer\Eidos.Setup.Ui\bin\Release\net472"
          dotnet build installer\Eidos.Msi\Eidos.Msi.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:BinDir=$bin -p:OutDir="$out\"
          if ($LASTEXITCODE -ne 0) { throw "building the upgrade core MSI failed ($LASTEXITCODE)" }
          dotnet build installer\Eidos.Bundle\Eidos.Bundle.wixproj -c Release -nologo -v minimal -p:Version=99.0.0 -p:MsiPath="$out\eidos.msi" -p:BaDir=$ba -p:OutDir="$out\"
          if ($LASTEXITCODE -ne 0) { throw "building the upgrade unified bundle failed ($LASTEXITCODE)" }

      - name: Define helpers
        shell: pwsh
        run: |
          @'
          function Run-Setup([string]$exe, [string]$arguments, [string]$log) {
            # Start-Process -Wait would wait for the process tree, and a
            # per-user install leaves eidos.exe running in the background;
            # wait for the setup process alone.
            $safeArguments = $arguments -replace '(?i)(EIDOS_SERVICE_PASSWORD=)(?:"[^"]*"|\S+)', '$1<redacted>'
            $p = [Diagnostics.Process]::Start($exe, "$arguments /log `"$log`"")
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "setup did not finish: $exe $safeArguments" }
            if ($p.ExitCode -ne 0) { Get-Content $log -ErrorAction SilentlyContinue | Select-Object -Last 60; throw "$exe $safeArguments exited $($p.ExitCode)" }
          }
          function Run-SetupExpectFailure([string]$exe, [string]$arguments, [string]$log) {
            $safeArguments = $arguments -replace '(?i)(EIDOS_SERVICE_PASSWORD=)(?:"[^"]*"|\S+)', '$1<redacted>'
            $p = [Diagnostics.Process]::Start($exe, "$arguments /log `"$log`"")
            if (-not $p.WaitForExit(600000)) { $p.Kill(); throw "setup did not finish: $exe $safeArguments" }
            if ($p.ExitCode -eq 0) { throw "$exe $safeArguments accepted an invalid unattended value" }
          }
          function Wait-Health([int]$port) {
            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { return }
              } catch {}
              Start-Sleep -Seconds 2
            }
            throw "no healthy service on port $port"
          }
          function Assert-Service([string]$name, [string]$state) {
            $s = Get-Service $name -ErrorAction SilentlyContinue
            if ($null -eq $s) { throw "service $name is not registered" }
            if ($s.Status -ne $state) { throw "service $name is $($s.Status), expected $state" }
          }
          function Assert-Retained([string]$what, $actual, $expected) {
            # Report the observed value: the runner is disposable, so the log
            # is the only evidence left of why a retention check failed.
            if ($actual -ne $expected) { throw "$what is '$actual', expected '$expected'" }
          }
          function Assert-RecoveryFixture([int]$port, [string]$recordPath) {
            $record = Get-Content -LiteralPath $recordPath -Raw | ConvertFrom-Json
            $url = "http://127.0.0.1:$port"
            $health = Invoke-RestMethod "$url/api/health" -TimeoutSec 10
            Assert-Retained 'installed catalog' ([IO.Path]::GetFullPath($health.catalog_path)) $record.catalog_path
            $source = Invoke-RestMethod "$url/api/sources/$($record.source_id)" -TimeoutSec 10
            Assert-Retained 'source root' $source.source.root_path $record.source_root
            Assert-Retained 'source content concurrency' $source.source.content_concurrency 1
            Assert-Retained 'source content extraction' $source.source.content_enabled $true
            $resources = Invoke-RestMethod "$url/api/resources" -TimeoutSec 10
            Assert-Retained 'scan threads' $resources.limits.scan_threads 3
            Assert-Retained 'concurrent scans' $resources.limits.concurrent_scans 2
            Assert-Retained 'minimum free MiB' $resources.limits.minimum_free_mib 512
            $devices = Invoke-RestMethod "$url/api/devices" -TimeoutSec 10
            Assert-Retained 'readers per device' $devices.budget.readers_per_device 3
            $workers = Invoke-RestMethod "$url/api/content/workers" -TimeoutSec 10
            Assert-Retained 'content workers' $workers.workers 3
            $pause = Invoke-RestMethod "$url/api/content/status" -TimeoutSec 10
            Assert-Retained 'content pause' $pause.paused $true
            Assert-Retained 'in-flight batches' $pause.in_flight 0
            # `ready` means the content index still reflects every stored
            # chunk: an installer operation that lost it would rebuild.
            Assert-Retained 'content search state' $pause.search 'ready'
            $search = Invoke-RestMethod "$url/api/search?q=content%3A%3Drecoveryinstallneedle&limit=10&count=exact" -TimeoutSec 15
            Assert-Retained 'content match total' ([long]$search.total.value) 4
            Assert-Retained 'content total exactness' $search.total.exact $true
            Assert-Retained 'returned content hits' $search.hits.Count 4
            Assert-Retained 'hits outside the fixture source' (@($search.hits | Where-Object { $_.source_id -ne $record.source_id }).Count) 0
            foreach ($file in $record.files) {
              Assert-Retained "hash of $($file.path)" (Get-FileHash -LiteralPath $file.path -Algorithm SHA256).Hash $file.sha256
            }
            Write-Host 'Retained four searchable files, source hashes, pause and resource settings.'
          }
          function Seed-RecoveryFixture([int]$port, [string]$recordPath, [string]$catalogPath = 'C:\ProgramData\eidos\catalog.db', [string]$fixtureParent = $env:RUNNER_TEMP) {
            # Called only on this disposable runner's fresh machine installation.
            $url = "http://127.0.0.1:$port"
            $health = Invoke-RestMethod "$url/api/health" -TimeoutSec 10
            $expectedCatalog = [IO.Path]::GetFullPath($catalogPath)
            if ([IO.Path]::GetFullPath($health.catalog_path) -ne $expectedCatalog) { throw 'Refusing unexpected catalog' }
            $sourceRoot = Join-Path $fixtureParent ('recovery-install-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $sourceRoot | Out-Null
            $files = @(foreach ($i in 1..4) {
              $path = Join-Path $sourceRoot "document-$i.txt"
              [IO.File]::WriteAllText($path, "recoveryinstallneedle synthetic document $i", [Text.UTF8Encoding]::new($false))
              @{ path = $path; sha256 = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash }
            })
            # Every seeded value differs from the service default (scan threads
            # 8, concurrent scans 1, 1024 MiB, 2 readers, 4 workers, source
            # concurrency 2), so a settings file an installer step dropped
            # cannot satisfy the checks by falling back.
            $null = Invoke-RestMethod "$url/api/resources" -Method Post -ContentType 'application/json' -TimeoutSec 10 -Body '{"scan_threads":3,"concurrent_scans":2,"minimum_free_mib":512}'
            $null = Invoke-RestMethod "$url/api/devices" -Method Post -ContentType 'application/json' -TimeoutSec 10 -Body '{"readers_per_device":3}'
            $null = Invoke-RestMethod "$url/api/content/workers" -Method Post -ContentType 'application/json' -TimeoutSec 10 -Body '{"workers":3}'
            $source = Invoke-RestMethod "$url/api/sources" -Method Post -ContentType 'application/json' -TimeoutSec 10 -Body (
              @{ name = 'installed-recovery-fixture'; root_path = $sourceRoot; scan = $false } | ConvertTo-Json)
            $sourceId = $source.source.id
            $null = Invoke-RestMethod "$url/api/sources/$sourceId/content" -Method Post -ContentType 'application/json' -TimeoutSec 10 -Body '{"enabled":true,"concurrency":1}'
            $null = Invoke-RestMethod "$url/api/sources/$sourceId/scan" -Method Post -TimeoutSec 10
            $deadline = [DateTime]::UtcNow.AddSeconds(90)
            do {
              $view = Invoke-RestMethod "$url/api/sources/$sourceId" -TimeoutSec 10
              if ($view.source.state -eq 'complete') { break }
              if ([DateTime]::UtcNow -gt $deadline) { throw 'Installed fixture did not complete' }
              Start-Sleep -Milliseconds 100
            } while ($true)
            # Pausing stops new claims only; a batch already claimed still runs
            # to completion, so wait for the drain the assertions expect.
            $flow = Invoke-RestMethod "$url/api/content/pause" -Method Post -TimeoutSec 10
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            while ($flow.in_flight -ne 0) {
              if ([DateTime]::UtcNow -gt $deadline) { throw "content is still draining: $($flow.flow_reason)" }
              Start-Sleep -Milliseconds 100
              $flow = Invoke-RestMethod "$url/api/content/status" -TimeoutSec 10
            }
            @{ catalog_path = $expectedCatalog; source_id = $sourceId; source_root = $sourceRoot; files = $files } |
              ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $recordPath
            Assert-RecoveryFixture $port $recordPath
          }
          '@ | Set-Content "$env:RUNNER_TEMP\helpers.ps1"

      - name: Core only, per-user (install, health, uninstall with purge)
        shell: pwsh
        timeout-minutes: 15
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $setup = "installer\out\eidos-setup.exe"
          Run-Setup $setup "/quiet EIDOS_PORT=7710 EIDOS_START_MENU=0 EIDOS_START_SERVICE=0" "$env:RUNNER_TEMP\core-user-install.log"
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "EIDOS_START_SERVICE=0 still launched eidos.exe" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name eidos -ErrorAction SilentlyContinue) { throw "EIDOS_START_SERVICE=0 still registered sign-in startup" }
          if (Get-Service eidos-collector -ErrorAction SilentlyContinue) { throw "the collector was installed without being asked for" }
          $menu = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\eidos'
          if (Test-Path $menu) { throw "EIDOS_START_MENU=0 did not suppress the Start-menu folder" }
          # Empty maintenance variables must preserve both zero-valued choices.
          Run-Setup $setup "/quiet /repair" "$env:RUNNER_TEMP\core-user-repair.log"
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "repair changed EIDOS_START_SERVICE=0" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name eidos -ErrorAction SilentlyContinue) { throw "repair added sign-in startup" }
          if (Test-Path $menu) { throw "repair changed EIDOS_START_MENU=0" }
          & "$env:LOCALAPPDATA\Programs\eidos\eidos.exe" serve --detach --data-dir "$env:LOCALAPPDATA\eidos" --log-dir "$env:LOCALAPPDATA\eidos\logs" --bind 127.0.0.1:7710
          if ($LASTEXITCODE -ne 0) { throw "manually starting the per-user core failed ($LASTEXITCODE)" }
          Wait-Health 7710
          Run-Setup $setup "/quiet /uninstall EIDOS_REMOVE_DATA=1" "$env:RUNNER_TEMP\core-user-uninstall.log"
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "eidos.exe still running after uninstall" }
          if (Test-Path "$env:LOCALAPPDATA\eidos") { throw "data directory left behind" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\eidos") { throw "program directory left behind" }

      - name: Retired installation blocks setup and direct MSI without deleting data
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $legacy = 'HKLM:\Software\eidos-collector'
          if (Test-Path $legacy) { throw "runner unexpectedly has a collector" }
          New-Item $legacy | Out-Null
          New-ItemProperty $legacy -Name Version -Value '0.5.0' | Out-Null
          try {
            Run-SetupExpectFailure "installer\out\eidos-setup.exe" "/quiet" "$env:RUNNER_TEMP\retirement.log"
            $msi = (Resolve-Path "installer\out\eidos.msi").Path
            $p = Start-Process msiexec.exe -ArgumentList "/i ""$msi"" /qn /l*v ""$env:RUNNER_TEMP\retirement-msi.log""" -WindowStyle Hidden -PassThru -Wait
            if ($p.ExitCode -eq 0) { throw "direct MSI ignored retired package" }
            if ((Get-ItemProperty $legacy).Version -ne '0.5.0') { throw "retirement gate mutated legacy state" }
            if (Get-Service eidos -ErrorAction SilentlyContinue) { throw "blocked setup installed the core" }
          } finally {
            Remove-Item -LiteralPath $legacy
          }

      - name: Machine install, upgrade and repair preserve indexed content, settings and identity
        shell: pwsh
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          Run-Setup "installer\out\eidos-setup.exe" "/quiet EIDOS_SCOPE=perMachine EIDOS_PORT=7720" "$env:RUNNER_TEMP\machine-install.log"
          Wait-Health 7720
          Assert-Service eidos Running
          $fleet = Invoke-RestMethod http://127.0.0.1:7720/api/fleet -TimeoutSec 30
          if (-not $fleet.node_id -or $fleet.central) { throw "invalid initial node role" }
          $fleet.node_id | Set-Content "$env:RUNNER_TEMP\node-id"
          $keyHash = (Get-FileHash 'C:\ProgramData\eidos\fleet\node.key').Hash
          Seed-RecoveryFixture 7720 "$env:RUNNER_TEMP\installed-recovery.json"
          $setup = "installer\out\upgrade\eidos-setup.exe"
          Run-Setup $setup "/quiet" "$env:RUNNER_TEMP\upgrade.log"
          Wait-Health 7720
          if ((Get-ItemProperty 'HKLM:\Software\eidos').Version -ne '99.0.0') { throw "upgrade version not installed" }
          Assert-RecoveryFixture 7720 "$env:RUNNER_TEMP\installed-recovery.json"
          Run-Setup $setup "/quiet /repair" "$env:RUNNER_TEMP\repair.log"
          Wait-Health 7720
          Assert-Service eidos Running
          Assert-RecoveryFixture 7720 "$env:RUNNER_TEMP\installed-recovery.json"
          if ((Get-FileHash 'C:\ProgramData\eidos\fleet\node.key').Hash -ne $keyHash) { throw "identity changed" }
          $fleet = Invoke-RestMethod http://127.0.0.1:7720/api/fleet -TimeoutSec 30
          if ($fleet.node_id -ne (Get-Content "$env:RUNNER_TEMP\node-id")) { throw "node changed" }
          if (Get-Service eidos-collector -ErrorAction SilentlyContinue) { throw "collector must not be installed" }
          $html = Invoke-WebRequest http://127.0.0.1:7720/ -TimeoutSec 30
          if ($html.Content -notmatch '<div id="root">') { throw "embedded UI missing" }

      - name: Invalid unattended values fail before changing the installation
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $setup = "installer\out\upgrade\eidos-setup.exe"
          Run-SetupExpectFailure $setup "/quiet EIDOS_SCOPE=machine" "$env:RUNNER_TEMP\invalid-scope.log"
          Run-SetupExpectFailure $setup "/quiet EIDOS_SERVICE_ACCOUNT_KIND=admin" "$env:RUNNER_TEMP\invalid-account.log"
          Run-SetupExpectFailure $setup "/quiet EIDOS_START_SERVICE=true" "$env:RUNNER_TEMP\invalid-start.log"
          Run-SetupExpectFailure $setup "/quiet /uninstall EIDOS_REMOVE_DATA=true" "$env:RUNNER_TEMP\invalid-remove.log"
          Wait-Health 7720

      - name: Uninstall preserves data, reinstall reuses it, explicit purge removes it
        shell: pwsh
        timeout-minutes: 20
        run: |
          . "$env:RUNNER_TEMP\helpers.ps1"
          $setup = "installer\out\upgrade\eidos-setup.exe"
          $keyHash = (Get-FileHash 'C:\ProgramData\eidos\fleet\node.key').Hash
          Run-Setup $setup "/quiet /uninstall" "$env:RUNNER_TEMP\uninstall-keep.log"
          if (Get-Service eidos -ErrorAction SilentlyContinue) { throw "service still registered" }
          if (Get-Process eidos -ErrorAction SilentlyContinue) { throw "process still running" }
          if (-not (Test-Path 'C:\ProgramData\eidos\catalog.db')) { throw "catalog deleted" }
          Run-Setup $setup "/quiet EIDOS_SCOPE=perMachine EIDOS_PORT=7720" "$env:RUNNER_TEMP\reinstall.log"
          Wait-Health 7720
          if ((Get-FileHash 'C:\ProgramData\eidos\fleet\node.key').Hash -ne $keyHash) { throw "reinstall changed identity" }
          Assert-RecoveryFixture 7720 "$env:RUNNER_TEMP\installed-recovery.json"
          Run-Setup $setup "/quiet /uninstall EIDOS_REMOVE_DATA=1" "$env:RUNNER_TEMP\uninstall-purge.log"
          if (Get-Service eidos -ErrorAction SilentlyContinue) { throw "service still registered after purge" }
          if (Test-Path 'C:\ProgramData\eidos') { throw "requested purge left data" }
          if (Test-Path 'C:\Program Files\eidos') { throw "program directory left behind" }

      - name: Keep lifecycle logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-lifecycle
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/installed-recovery.json
          retention-days: 14
