name: nightly

# The per-commit gate (ci.yml) lints Windows but does not test it: the whole
# suite is portable apart from ten cfg(windows) source files, macOS runs it in
# half the time, and scripts/check.ps1 runs it on Windows before a commit.
# What that leaves uncovered is Windows *runtime* behaviour — path separators,
# case folding, file locking, reserved names — so it runs here every night and
# again on a release tag.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: 0

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-suite:
    name: full suite (windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo test

      # A nightly nobody reads is not a gate. Failing on Windows behaviour is
      # exactly the risk the lean per-commit gate accepts, so it files a task
      # rather than only turning the run red.
      - name: File a task for the failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = 'Nightly Windows suite failed';
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            });
            if (existing.data.total_count === 0) {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body: `The Windows test suite failed on \`${context.sha}\`.\n\nThe per-commit gate lints Windows but does not test it, so this is the first automated check to run these tests on Windows since the last nightly.\n\nRun: ${run}`,
              });
            }
