name: release

# A pushed `v*` tag is the release. The tag is the canonical version: it must
# match the workspace version in Cargo.toml (so the executable reports it),
# it is stamped into web/package.json, and it names the installers and the
# GitHub release.
#
# `test` (the full gate) and `build` (compile, package, sign, verify) run in
# parallel; `publish` waits for both, so nothing reaches the release page
# unless the whole suite passed on the tagged tree. A red suite wastes some
# signing work but publishes nothing.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Everything that carries a signature: the product, the setup UI, the
  # package, the Burn engine, and the finished bundle.
  SIGN_DESCRIPTION: eidos
  SIGN_TIMESTAMP: http://timestamp.acs.microsoft.com

jobs:
  # The same gate as scripts/check.ps1: format, lint, the generated API
  # contract, every Rust test on Windows, and the web lint/tests/build.
  test:
    name: full gate (windows)
    runs-on: windows-2025
    steps:
      - name: Check out the revision being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # ci.yml's Windows lint lane and nightly.yml keep this cache warm
          # on every push/night; a release only reads it.
          shared-key: windows-dev
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-nextest

      - name: Format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Generated API contract is current
        shell: pwsh
        run: |
          cargo test --locked -p eidos-service export_api_contract --lib
          if ($LASTEXITCODE -ne 0) { throw "contract export failed ($LASTEXITCODE)" }
          git diff --exit-code -- web/src/generated/api.ts
          if ($LASTEXITCODE -ne 0) { throw 'web/src/generated/api.ts is stale; regenerate and commit it' }

      - name: Run the Windows test suite
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: |
          cargo nextest run --locked
          cargo test --doc --locked

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web lint, tests and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  build:
    name: signed Windows x86-64 installer
    runs-on: windows-2025
    environment: release

    steps:
      - name: Validate signing configuration
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          $required = @{
            AZURE_ARTIFACT_SIGNING_ENDPOINT = $env:ARTIFACT_SIGNING_ENDPOINT
            AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME = $env:ARTIFACT_SIGNING_ACCOUNT
            AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME = $env:ARTIFACT_SIGNING_PROFILE
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET = $env:AZURE_CLIENT_SECRET
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
          }

          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object Key)

          if ($missing.Count -gt 0) {
            throw "Missing release environment configuration: $($missing -join ', ')"
          }

          $endpoint = $null
          if (-not [Uri]::TryCreate(
              $env:ARTIFACT_SIGNING_ENDPOINT,
              [UriKind]::Absolute,
              [ref]$endpoint
            ) -or $endpoint.Scheme -ne 'https') {
            throw 'AZURE_ARTIFACT_SIGNING_ENDPOINT must be an absolute HTTPS URL.'
          }

      - name: Check out the revision being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the version from the tag
        id: release_version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # v1.2.3 or v1.2.3-rc.1 -> 1.2.3 / 1.2.3-rc.1. Windows Installer
          # versions are numeric; installer\build.ps1 drops any pre-release
          # suffix for the MSI and bundle metadata.
          if ($env:RELEASE_TAG -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)$') {
            throw "release tag $env:RELEASE_TAG is not v<major>.<minor>.<patch>[-pre]"
          }
          $version = $Matches[1]

          $manifest = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($manifest, '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'workspace package version is missing from Cargo.toml' }
          if ($match.Groups[1].Value -ne $version) {
            throw "release tag $env:RELEASE_TAG does not match workspace version $($match.Groups[1].Value) in Cargo.toml; bump Cargo.toml (and Cargo.lock) before tagging"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing $version"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Release-profile artifacts; only this job builds them.
          shared-key: windows-release

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install the WiX command line (burn detach/reattach)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 7.0.0
          wix eula accept wix7
          wix --version

      - name: Stamp the release version into the web UI
        shell: pwsh
        working-directory: web
        env:
          EIDOS_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: npm version $env:EIDOS_RELEASE_VERSION --no-git-tag-version --allow-same-version

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build Windows executable
        # The web UI is embedded in the executable; refuse to build without it.
        env:
          EIDOS_REQUIRE_WEB: "1"
        run: cargo build --locked --release --bin eidos

      - name: Build setup UI
        shell: pwsh
        env:
          EIDOS_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: .\installer\build.ps1 -Version $env:EIDOS_RELEASE_VERSION -SkipWeb -SkipRust -SkipMsi -SkipBundle -SkipCollectorMsi -SkipCollectorBundle

      - name: Sign eidos.exe and the setup UI
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: |
            ${{ github.workspace }}\target\release\eidos.exe
            ${{ github.workspace }}\installer\Eidos.Setup.Ui\bin\Release\net472\eidos-setup-ui.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.SIGN_TIMESTAMP }}
          timestamp-digest: SHA256
          description: ${{ env.SIGN_DESCRIPTION }}
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build both MSIs (binding the signed executable)
        shell: pwsh
        env:
          EIDOS_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: .\installer\build.ps1 -Version $env:EIDOS_RELEASE_VERSION -SkipWeb -SkipRust -SkipUi -SkipBundle -SkipCollectorBundle

      - name: Sign both MSIs
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: |
            ${{ github.workspace }}\installer\out\eidos.msi
            ${{ github.workspace }}\installer\out\eidos-collector.msi
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.SIGN_TIMESTAMP }}
          timestamp-digest: SHA256
          description: ${{ env.SIGN_DESCRIPTION }}
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Build both bundles (from the signed MSIs and UI)
        shell: pwsh
        env:
          EIDOS_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: .\installer\build.ps1 -Version $env:EIDOS_RELEASE_VERSION -SkipWeb -SkipRust -SkipMsi -SkipUi -SkipCollectorMsi

      - name: Detach the Burn engines
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force installer\out\engine | Out-Null
          wix burn detach installer\out\eidos-setup.exe -engine installer\out\engine\burn-engine.exe
          wix burn detach installer\out\eidos-collector-setup.exe -engine installer\out\engine\burn-engine-collector.exe

      - name: Sign the Burn engines
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: |
            ${{ github.workspace }}\installer\out\engine\burn-engine.exe
            ${{ github.workspace }}\installer\out\engine\burn-engine-collector.exe
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.SIGN_TIMESTAMP }}
          timestamp-digest: SHA256
          description: ${{ env.SIGN_DESCRIPTION }}
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Reattach the signed engines
        id: names
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG
          $setup = "installer\out\eidos-$version-setup.exe"
          $msi = "installer\out\eidos-$version.msi"
          $collectorSetup = "installer\out\eidos-collector-$version-setup.exe"
          $collectorMsi = "installer\out\eidos-collector-$version.msi"
          wix burn reattach installer\out\eidos-setup.exe -engine installer\out\engine\burn-engine.exe -o $setup
          wix burn reattach installer\out\eidos-collector-setup.exe -engine installer\out\engine\burn-engine-collector.exe -o $collectorSetup
          Copy-Item installer\out\eidos.msi $msi
          Copy-Item installer\out\eidos-collector.msi $collectorMsi
          "setup=$setup" >> $env:GITHUB_OUTPUT
          "msi=$msi" >> $env:GITHUB_OUTPUT
          "collector_setup=$collectorSetup" >> $env:GITHUB_OUTPUT
          "collector_msi=$collectorMsi" >> $env:GITHUB_OUTPUT

      - name: Sign both setup bundles
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files: |
            ${{ github.workspace }}\${{ steps.names.outputs.setup }}
            ${{ github.workspace }}\${{ steps.names.outputs.collector_setup }}
          file-digest: SHA256
          timestamp-rfc3161: ${{ env.SIGN_TIMESTAMP }}
          timestamp-digest: SHA256
          description: ${{ env.SIGN_DESCRIPTION }}
          description-url: https://github.com/${{ github.repository }}
          exclude-environment-credential: false
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify every signature and timestamp
        shell: pwsh
        env:
          SETUP: ${{ steps.names.outputs.setup }}
          MSI: ${{ steps.names.outputs.msi }}
          COLLECTOR_SETUP: ${{ steps.names.outputs.collector_setup }}
          COLLECTOR_MSI: ${{ steps.names.outputs.collector_msi }}
        run: |
          function Assert-Signed([string]$path) {
            $signature = Get-AuthenticodeSignature -LiteralPath $path
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Authenticode verification failed for ${path}: $($signature.StatusMessage)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "$path has no trusted timestamp."
            }
            Write-Host "$path signed by $($signature.SignerCertificate.Subject) ($($signature.SignerCertificate.Thumbprint))"
          }
          Assert-Signed 'target\release\eidos.exe'
          Assert-Signed 'installer\Eidos.Setup.Ui\bin\Release\net472\eidos-setup-ui.exe'
          Assert-Signed $env:MSI
          Assert-Signed 'installer\out\engine\burn-engine.exe'
          Assert-Signed $env:SETUP
          Assert-Signed $env:COLLECTOR_MSI
          Assert-Signed 'installer\out\engine\burn-engine-collector.exe'
          Assert-Signed $env:COLLECTOR_SETUP

          foreach ($file in @($env:SETUP, $env:MSI, $env:COLLECTOR_SETUP, $env:COLLECTOR_MSI)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content -LiteralPath "$file.sha256" -NoNewline
            $certutil = & certutil.exe -hashfile $file SHA256
            if ($LASTEXITCODE -ne 0) { throw "certutil could not hash $file ($LASTEXITCODE)" }
            $verified = ($certutil | Where-Object { $_ -match '^[0-9A-Fa-f ]{64,}$' } | Select-Object -First 1) -replace ' ', ''
            if ([string]::IsNullOrWhiteSpace($verified) -or $verified.ToLowerInvariant() -ne $hash) {
              throw "independent checksum verification failed for $file"
            }
          }

      - name: Upload the signed assets for publishing
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-assets
          if-no-files-found: error
          path: |
            ${{ steps.names.outputs.setup }}
            ${{ steps.names.outputs.setup }}.sha256
            ${{ steps.names.outputs.msi }}
            ${{ steps.names.outputs.msi }}.sha256
            ${{ steps.names.outputs.collector_setup }}
            ${{ steps.names.outputs.collector_setup }}.sha256
            ${{ steps.names.outputs.collector_msi }}
            ${{ steps.names.outputs.collector_msi }}.sha256

  # Publishes only when the gate and the signed build both passed.
  publish:
    name: publish the release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # For docs/releases/<tag>.md, the release notes.
      - name: Check out the revision being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-assets
          path: assets

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(assets/*)
          if [ "${#assets[@]}" -ne 8 ]; then
            echo "expected 8 assets, found ${#assets[@]}:"; printf '%s\n' "${assets[@]}"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber "${assets[@]}"
          else
            args=(--title "$RELEASE_TAG")
            # The release notes are docs/releases/<tag>.md when it exists;
            # otherwise GitHub generates them from the merged pull requests.
            notes="docs/releases/$RELEASE_TAG.md"
            if [ -f "$notes" ]; then
              args+=(--notes-file "$notes")
            else
              args+=(--generate-notes)
            fi
            # A tag carrying a pre-release suffix (v1.2.0-rc.1) publishes as
            # a pre-release so it is not offered as the latest download.
            case "$RELEASE_TAG" in *-*) args+=(--prerelease);; esac
            gh release create "$RELEASE_TAG" "${args[@]}" "${assets[@]}"
          fi
