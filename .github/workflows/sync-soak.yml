name: sync DST soak

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Deterministic universes to run
        required: false
        default: "1000000"

permissions:
  contents: read
  issues: write

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOAK_SEEDS: ${{ inputs.seeds || '1000000' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Initialize diagnostics
        run: |
          : > sync-soak-failures.jsonl
          {
            echo "requested_seeds=$SOAK_SEEDS"
            echo "outcome=not_started"
          } > sync-soak-status.txt
      - name: Run deterministic protocol universes
        id: soak
        continue-on-error: true
        timeout-minutes: 350
        run: cargo run --locked --release -p eidos-sync --bin dst-soak -- "$SOAK_SEEDS" sync-soak-failures.jsonl 20
      - name: Record soak outcome
        if: always()
        env:
          SOAK_OUTCOME: ${{ steps.soak.outcome }}
        run: |
          {
            echo "requested_seeds=$SOAK_SEEDS"
            echo "outcome=$SOAK_OUTCOME"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > sync-soak-status.txt
      - name: Upload replay records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sync-soak-failures
          path: |
            sync-soak-failures.jsonl
            sync-soak-status.txt
          if-no-files-found: error
          retention-days: 30
      - name: File one task per failing seed
        if: steps.soak.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const replay = fs.readFileSync('sync-soak-failures.jsonl', 'utf8').trim();
            const status = fs.readFileSync('sync-soak-status.txt', 'utf8').trim();
            const failures = [];
            let malformed = false;
            for (const line of replay.split(/\r?\n/).filter(Boolean)) {
              try {
                failures.push(JSON.parse(line));
              } catch {
                malformed = true;
              }
            }
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const tasks = failures.map(failure => ({
              title: `DST failing seed ${failure.seed}`,
              body: `Nightly deterministic sync simulation failed.\n\n${failure.message}\n\n\`\`\`rust\n${failure.reproducer}\n\`\`\`\n\nRun: ${run}`,
            }));
            if (tasks.length === 0 || malformed) {
              tasks.push({
                title: 'DST soak infrastructure failure',
                body: `The nightly sync soak failed without a complete replay record. Inspect the uploaded status and replay artifacts.\n\n\`\`\`text\n${status}\n\`\`\`\n\nRun: ${run}`,
              });
            }
            for (const task of tasks) {
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${task.title}"`,
              });
              if (existing.data.total_count === 0) {
                await github.rest.issues.create({
                  ...context.repo,
                  ...task,
                });
              }
            }
      - name: Fail the gate
        if: steps.soak.outcome == 'failure'
        run: exit 1
