name: sync DST soak

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      seeds:
        description: Deterministic universes to run
        required: false
        default: "1000000"

permissions:
  contents: read
  issues: write

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOAK_SEEDS: ${{ inputs.seeds || '1000000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run deterministic protocol universes
        id: soak
        continue-on-error: true
        run: cargo run --locked --release -p eidos-sync --bin dst-soak -- "$SOAK_SEEDS" sync-soak-failures.jsonl 20
      - name: Upload replay records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-soak-failures
          path: sync-soak-failures.jsonl
          if-no-files-found: error
          retention-days: 30
      - name: File one task per failing seed
        if: steps.soak.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const failures = fs.readFileSync('sync-soak-failures.jsonl', 'utf8')
              .trim().split(/\r?\n/).filter(Boolean).map(JSON.parse);
            for (const failure of failures) {
              const title = `DST failing seed ${failure.seed}`;
              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
              });
              if (existing.data.total_count === 0) {
                await github.rest.issues.create({
                  ...context.repo,
                  title,
                  body: `Nightly deterministic sync simulation failed.\n\n${failure.message}\n\n\`\`\`rust\n${failure.reproducer}\n\`\`\`\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                });
              }
            }
      - name: Fail the gate
        if: steps.soak.outcome == 'failure'
        run: exit 1
