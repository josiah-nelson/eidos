[workspace]
resolver = "2"
members = [
    "crates/eidos-domain",
    "crates/eidos-catalog",
    "crates/eidos-scanner",
    "crates/eidos-content",
    "crates/eidos-archive",
    "crates/eidos-diskimg",
    "crates/eidos-sync",
    "crates/eidos-fleet",
    "crates/eidos-search",
    "crates/eidos-query",
    "crates/eidos-service",
    "crates/eidos-cli",
    "crates/eidos-observe",
    "crates/eidos-macos-collector",
    "crates/eidos-windows-collector",
]

[workspace.package]
version = "0.5.0-dev"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/josiah-nelson/eidos"

[workspace.dependencies]
eidos-domain = { path = "crates/eidos-domain" }
eidos-catalog = { path = "crates/eidos-catalog" }
eidos-archive = { path = "crates/eidos-archive" }
eidos-diskimg = { path = "crates/eidos-diskimg" }
eidos-sync = { path = "crates/eidos-sync" }
eidos-fleet = { path = "crates/eidos-fleet" }
eidos-scanner = { path = "crates/eidos-scanner" }
eidos-content = { path = "crates/eidos-content" }
eidos-search = { path = "crates/eidos-search" }
eidos-query = { path = "crates/eidos-query" }
eidos-service = { path = "crates/eidos-service" }
eidos-observe = { path = "crates/eidos-observe" }
eidos-macos-collector = { path = "crates/eidos-macos-collector" }
eidos-windows-collector = { path = "crates/eidos-windows-collector" }

anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util"] }
axum = { version = "0.8", features = ["json", "query", "tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
rusqlite = { version = "0.40", features = ["bundled", "blob", "functions"] }
tantivy = "0.26"
blake3 = "1.8"
getrandom = "0.4"
crc32fast = "1.5"
ntfs = "0.4"
# Fleet transport: TLS with per-node self-signed certificates pinned by
# fingerprint (no CA). The ring provider is what ureq already links.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
clap = { version = "4.6", features = ["derive", "env"] }
regex = "1.13"
regex-syntax = "0.8"
encoding_rs = "0.8"
zstd = "0.13"
mimalloc = "0.1"
crossbeam-channel = "0.5"
libc = "0.2"
parking_lot = { version = "0.12", features = ["arc_lock", "send_guard"] }
memchr = "2.8"
lru = "0.16"
bytes = "1.12"
futures-core = "0.3"
futures-util = "0.3"
tempfile = "3.27"
# Web UI embedded in the executable; `debug-embed` keeps dev and release
# builds identical, `mime-guess` sets content types.
rust-embed = { version = "8.12", features = ["debug-embed", "mime-guess"] }
# Windows service control manager (install/run/stop) for `eidos service`.
windows-service = "0.8"
# Rolling log files for headless (service) runs.
tracing-appender = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_SystemServices",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# Test wall time is dominated by CPU-bound work — the deterministic sync
# simulation, tantivy indexing, hashing — which an unoptimised build runs
# several times slower than an optimised one. Optimising dependencies fully
# and workspace crates lightly keeps compile time close to a plain debug
# build while cutting test run time by more than half; `debug-assertions`
# and overflow checks stay on, so the tests keep checking what they did.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1
codegen-units = 4
lto = "thin"

[profile.bench]
inherits = "release"
