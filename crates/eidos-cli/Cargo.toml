[package]
name = "eidos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "eidos"
path = "src/main.rs"

[dependencies]
eidos-domain = { workspace = true }
eidos-scanner = { workspace = true }
eidos-catalog = { workspace = true }
eidos-service = { workspace = true }
eidos-search = { workspace = true }
eidos-query = { workspace = true }
eidos-content = { workspace = true }
eidos-observe = { workspace = true }
eidos-fleet = { workspace = true }
windows-sys = { workspace = true }
regex = { workspace = true }
mimalloc = { workspace = true }
ureq = { version = "3.4", features = ["json"] }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

[target.'cfg(windows)'.dependencies]
eidos-windows-collector = { workspace = true }
windows-service = { workspace = true }
# Interactive password prompt for `eidos service install --account user`.
rpassword = "7"

[target.'cfg(target_os = "macos")'.dependencies]
eidos-macos-collector = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
